name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package.json
          
      - name: Install Web Dependencies
        working-directory: web
        run: npm install --legacy-peer-deps
        
      - name: Web Production Build
        working-directory: web
        run: CI=false npm run build
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            web/build/
            app/build/outputs/apk/debug/app-debug.apk

  selenium-tests:
    name: ✔ Selenium Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: web
        run: npm install selenium-webdriver mocha chai exceljs --legacy-peer-deps
      - name: Run Selenium Tests
        working-directory: web
        run: |
          mkdir -p ../"FINAL REPORTS"
          node scripts/run-selenium-tests.js
      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: "FINAL REPORTS/Selenium_*"

  mobile-tests:
    name: ✔ Mobile Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: web
        run: npm install exceljs --legacy-peer-deps
      - name: Run Appium Tests
        working-directory: web
        run: |
          mkdir -p ../"FINAL REPORTS"
          node scripts/run-mobile-tests.js
      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reports
          path: "FINAL REPORTS/Appium_*"

  load-tests:
    name: ✔ Load Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: web
        run: npm install exceljs --legacy-peer-deps
      - name: Run Performance Tests
        working-directory: web
        run: |
          mkdir -p ../"FINAL REPORTS"
          node scripts/run-load-tests.js
      - name: Upload Performance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: "FINAL REPORTS/Load_*"

  security-tests:
    name: ✔ Security Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: web
        run: npm install exceljs --legacy-peer-deps
      - name: Run OWASP ZAP Security Scan
        working-directory: web
        run: |
          mkdir -p ../"FINAL REPORTS"
          node scripts/run-security-tests.js
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: "FINAL REPORTS/Vulnerability_*"

  bundle-reports:
    name: ✔ Bundle Reports
    needs: [selenium-tests, mobile-tests, load-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      - name: Organize and Zip Reports
        run: |
          mkdir -p "FINAL REPORTS"
          find all-reports -name "Selenium_*" -exec cp {} "FINAL REPORTS/" \;
          find all-reports -name "Appium_*" -exec cp {} "FINAL REPORTS/" \;
          find all-reports -name "Load_*" -exec cp {} "FINAL REPORTS/" \;
          find all-reports -name "Vulnerability_*" -exec cp {} "FINAL REPORTS/" \;
          zip -r FINAL_REPORTS.zip "FINAL REPORTS"
      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_REPORTS_BUNDLE
          path: FINAL_REPORTS.zip

  deploy:
    name: ✔ Deploy
    needs: bundle-reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-out
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build-out/web/build
